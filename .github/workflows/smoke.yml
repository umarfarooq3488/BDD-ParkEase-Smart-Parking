name: ParkEase BDD tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  behave:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: BSE241029

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: BSE241029/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Behave tests
        run: python -m behave
